[package]
name = "simple-web-healthcheck"
version = "0.3.1"
edition = "2024"
authors = ["Simon Barth <data5tream@protonmail.com>"]
license = "MIT"
repository = "https://github.com/Data5tream/simple-web-healthcheck-rs"
categories = ["command-line-utilities"]
description = "A simple healthcheck for web containers"
readme = "README.md"

[lints.clippy]
pedantic = "warn"

[dependencies]
hyper = { version = "1", features = ["full"] }
tokio = { version = "1", features = ["full"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["full"] }
