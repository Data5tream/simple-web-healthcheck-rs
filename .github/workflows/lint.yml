name: Lint

on:
  push:
    paths-ignore:
      - '**.md'

permissions:
  checks: write

jobs:
  run-clippy:
    name: Run clippy
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup show active-toolchain

      - name: Check linting
        run: cargo clippy

      - name: Check formatting
        run: cargo fmt --check
